[project]
name = "vision-ops-backend"
version = "1.0.0"
description = "Unified VisionOps API: vision inference, HAR, alerts, timeline, advisor."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.24.0,<2.0",
    "joblib>=1.5.3",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "strands-agents[ollama]>=0.1.0",
    "mailersend>=0.6.0",
    "fpdf2>=2.7.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_ops_backend", "src/vision_ops_alerting"]

[project.optional-dependencies]
har = [
    "torch>=2.0",
    "torchvision>=0.15.0",
    "transformers>=4.41.0,<5.0.0",
    "pillow>=10.0",
    "ultralytics>=8.0.0",
    "lap>=0.5.12",
]
mcp = ["mcp>=1.2.0"]

[tool.uv]
package = true
