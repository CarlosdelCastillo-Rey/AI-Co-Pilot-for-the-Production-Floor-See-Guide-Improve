[project]
name = "vision-ops-backend"
version = "0.1.0"
description = "VisionOps side backend: webcam MJPEG mock for live camera UI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.24.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_ops_backend"]

[tool.uv]
package = true
