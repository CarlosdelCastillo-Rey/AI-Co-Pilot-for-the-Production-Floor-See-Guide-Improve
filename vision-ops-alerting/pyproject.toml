[project]
name = "vision-ops-alerting"
version = "0.1.0"
description = "VisionOps alerting backend: Strands agent + MailerSend email notifications."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",

    # Agent + LLM routing (local-first via Ollama by default)
    "strands-agents[ollama]>=0.1.0",

    # Email provider SDK (token via env var; never commit secrets)
    "mailersend>=0.6.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_ops_alerting"]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[tool.uv]
package = true
